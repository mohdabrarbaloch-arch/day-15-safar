services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: safar
      POSTGRES_PASSWORD: safar_dev_password
      POSTGRES_DB: safar
    volumes:
      - safar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safar -d safar"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://safar:safar_dev_password@db:5432/safar
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-please-0000000000}
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      SEED_DEMO: "true"
      SIM_MAX_DURATION: "120"
      SIM_MAX_FRAMES: "4000"
    ports:
      - "8000:8000"

volumes:
  safar_pgdata:
